plugins {
    id 'com.android.application'
}

// 调试用的大模型 key 放在 local.properties（已被 .gitignore 排除）：llm.apiKey=sk-xxx
def localProps = new Properties()
def localFile = rootProject.file('local.properties')
if (localFile.exists()) localFile.withInputStream { localProps.load(it) }

android {
    namespace 'com.raferlyan.hark'
    compileSdk 35

    defaultConfig {
        applicationId 'com.raferlyan.hark'
        minSdk 26
        targetSdk 35
        versionCode 3
        versionName '0.3.0'
        ndk { abiFilters 'arm64-v8a' }
        // 发布包里不带 key，用户在设置里自己填
        buildConfigField 'String', 'LLM_DEBUG_KEY', '""'
    }
    buildFeatures {
        buildConfig true
    }

    buildTypes {
        debug {
            buildConfigField 'String', 'LLM_DEBUG_KEY', "\"${localProps.getProperty('llm.apiKey', '')}\""
        }
        release {
            minifyEnabled false
            signingConfig signingConfigs.debug
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    packaging {
        jniLibs.useLegacyPackaging = true
    }
}

dependencies {
    implementation files('libs/sherpa-onnx-1.13.8.aar')
}
